<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="DSH Git Panel — 会话右侧栏的可视化 Git">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="0.55" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#034ea1"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080e1a" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#080e1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#fade)"/>

  <!-- commit-graph motif: the same lanes, rounded bends and solid dots the panel draws -->
  <g transform="translate(44 0)">
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M968 28 V272" stroke="#4169e1" stroke-opacity="0.95"/>
    <path d="M968 112 C968 134, 1032 132, 1032 156 V272" stroke="#3DA66B" stroke-opacity="0.95"/>
    <path d="M1032 200 C1032 222, 1096 220, 1096 244 V272" stroke="#d99a2b" stroke-opacity="0.95"/>
    <path d="M1096 244 C1096 262, 1150 262, 1150 272" stroke="#d99a2b" stroke-opacity="0.95"/>
    <path d="M1150 28 V272" stroke="#8b98a8" stroke-opacity="0.55"/>
  </g>

  <g stroke="#080e1a" stroke-width="3">
    <circle cx="968" cy="70" r="7" fill="#4169e1"/>
    <circle cx="968" cy="156" r="7" fill="#4169e1"/>
    <circle cx="968" cy="234" r="7" fill="#4169e1"/>
    <circle cx="1032" cy="112" r="7" fill="#3DA66B"/>
    <circle cx="1032" cy="200" r="7" fill="#3DA66B"/>
    <circle cx="1096" cy="244" r="7" fill="#d99a2b"/>
    <circle cx="1150" cy="118" r="7" fill="#8b98a8"/>
  </g>
  </g>

  <text x="72" y="96" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" letter-spacing="3.4" fill="#6f8cba">DEEPSEEK HARNESS · PLUGIN</text>
  <text x="72" y="158" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#ffffff">DSH Git Panel</text>
  <text x="72" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#a9c2e8">会话右侧栏的可视化 Git · 改动清单 / 统一 diff / 提交图 / 分支与标签 / 远程同步</text>
</svg>
